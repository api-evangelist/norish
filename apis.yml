aid: norish
name: Norish
description: Norish is an open-source, self-hosted recipe and meal-planning application built for
  households — import a recipe from a URL, video or photo, plan the week on a shared calendar, and
  keep a grocery list that every member of the household sees update in real time. It is distributed
  as a Docker image (norishapp/norish) under AGPL-3.0 and runs entirely on the operator's own
  hardware, with PostgreSQL, Redis and a Python parser service behind it. Each instance exposes an
  HTTP API under /api/v1 — recipes, recipe imports, groceries, stores and planned recipes — secured
  with an instance-issued API key, plus a generated OpenAPI document and a Scalar API reference that
  are served from the running instance to signed-in users.
